
services:

  telegram_logic:
    restart: "no"                  # в dev падение должно быть видно, а не уходить в рестарт-луп
    stop_grace_period: 10s         # в dev не ждём дообработки очереди

    volumes:
      - ./telegram_logic:/app
      - ./packages/kb_schemas:/packages/kb_schemas   # editable-установка: правки подхватываются без пересборки
      - ./packages/logger:/packages/logger
      - ./telegram_logic/logs:/app/logs

  database:
    restart: "no"
    stop_grace_period: 10s

    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "5432", "--reload"]

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - ./database:/app
      - ./packages/kb_schemas:/packages/kb_schemas
      - ./packages/logger:/packages/logger
      - ./database/logs:/app/logs